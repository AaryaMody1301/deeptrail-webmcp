name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Emit generated lockfile for repository hardening
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "DEEPTRAIL_LOCKFILE_BASE64_BEGIN"
          base64 -w 0 package-lock.json
          echo
          echo "DEEPTRAIL_LOCKFILE_BASE64_END"
